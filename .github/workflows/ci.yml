name: CI

on:
  push:
    branches: ["main", "phase*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (incl. modbus extra, for the real-pymodbus tests)
        run: uv sync --extra modbus

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy --strict)
        run: uv run mypy

      - name: Test (pytest, incl. P5 golden-trace regression)
        run: uv run pytest -v
