[project]
name = "digitwin"
version = "0.1.0"
description = "A small soft-PLC engine and simulation harness."
readme = "README.md"
authors = [
    { name = "zl", email = "a@a" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]
modbus = [
    # 3.11 renamed slave= -> device_id= on the client; ModbusSlaveServer's
    # live-sync bridge additionally depends on SimDevice/action (pymodbus's
    # simulator-backed datastore), verified against 3.15 — the floor here is
    # the highest version this repo has actually run against, not a
    # guarantee it works on everything back to 3.11.
    "pymodbus>=3.15,<4",
]

[project.scripts]
digitwin = "digitwin.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

# uv installs this group automatically on `uv sync`; it mirrors the
# `dev` extra above so plain-pip users can run `pip install -e ".[dev]"`.
[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So tests can `import examples.*` (the example twins under examples/ are not
# an installed package). digitwin itself still resolves via the editable install.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# pymodbus is an optional extra (digitwin[modbus]); mypy runs without it
# installed, and the adapter imports it lazily at runtime anyway.
[[tool.mypy.overrides]]
module = "pymodbus.*"
ignore_missing_imports = true
